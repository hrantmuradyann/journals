<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journals</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<main class="container">
  <div class="actionbar">
    <p class="status" id="status">Loading…</p>
    <button id="calendar-btn" class="btn-secondary" title="Calendar of what you read">
      <span class="btn-label">Calendar</span>
    </button>
    <button id="read-btn" class="btn-secondary" title="Articles you marked as read">
      <span class="btn-label">Read</span>
      <span class="badge" id="read-count">0</span>
    </button>
    <button id="refresh-btn" class="btn-primary">
      <span class="spinner" hidden></span>
      <span class="btn-label">Check latest news</span>
    </button>
  </div>

  <div id="message" class="message" hidden></div>

  <nav class="tabs" id="tabs"></nav>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search headlines, descriptions and authors…" autocomplete="off">
    <div class="chips" id="pub-chips"></div>
  </div>

  <section id="content"></section>
</main>

<script>
  // ---- State ---------------------------------------------------------------
  var report = null;                 // everything returned by /articles
  var activeTab = "Same story";
  var hiddenPublications = {};       // publication name -> true when hidden
  var searchText = "";
  var readHistory = {};                  // link -> read-article entry (from /history). Not named "history": window.history is the browser API
  var readFilter = "all";            // Read view: all | one of RATINGS | unrated
  var readSort = "read_at";          // Read view: read_at | rating | published
  var RATINGS = ["great", "normal", "hard", "bad"];
  var lastTab = "Same story";        // tab to return to when leaving the Read / Calendar views
  var calYear = null;                // Calendar view: month on screen (set on first open)
  var calMonth = null;               // 0-11
  var calSelectedDay = null;         // "YYYY-MM-DD" of the clicked day, or null
  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June",
                     "July", "August", "September", "October", "November", "December"];
  var WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

  // Tab order shown in the page. Topic and region names come from the server.
  function tabList() {
    var tabs = ["Same story", "Educational"];
    report.topics.forEach(function (t) { if (t !== "Other") tabs.push(t); });
    report.regions.forEach(function (r) { tabs.push(r); });
    tabs.push("Other");
    return tabs;
  }

  // ---- Loading -------------------------------------------------------------
  function loadHistory() {
    return fetch("/history")
      .then(function (r) { return r.json(); })
      .then(function (data) { readHistory = data.articles || {}; })
      .catch(function (err) { showMessage("Could not load reading history: " + err, false); });
  }

  function loadArticles() {
    setStatus("Loading…");
    fetch("/articles")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) {
          showMessage(data.message, false);
          setStatus("No data yet");
          return;
        }
        report = data;
        hideMessage();
        setStatus(report.total + " articles · last fetched " + report.fetched_at);
        renderTabs();
        renderPublicationChips();
        renderContent();
      })
      .catch(function (err) { showMessage("Could not load articles: " + err, false); });
  }

  function refreshNews() {
    var btn = document.getElementById("refresh-btn");
    btn.disabled = true;
    btn.querySelector(".spinner").hidden = false;
    btn.querySelector(".btn-label").textContent = "Fetching…";
    setStatus("Downloading feeds, this takes a minute or two…");
    hideMessage();

    fetch("/refresh", { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) {
          showMessage("Fetch script failed:\n" + data.log, false);
        }
        loadArticles();
      })
      .catch(function (err) { showMessage("Refresh failed: " + err, false); })
      .finally(function () {
        btn.disabled = false;
        btn.querySelector(".spinner").hidden = true;
        btn.querySelector(".btn-label").textContent = "Check latest news";
      });
  }

  // ---- Small helpers -------------------------------------------------------
  function setStatus(text) { document.getElementById("status").textContent = text; }

  function showMessage(text, isGood) {
    var box = document.getElementById("message");
    box.textContent = text;
    box.className = "message " + (isGood ? "good" : "bad");
    box.hidden = false;
  }
  function hideMessage() { document.getElementById("message").hidden = true; }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function slug(name) { return name.toLowerCase().replace(/[^a-z]+/g, "-"); }

  // Newest first; "published" is "YYYY-MM-DD HH:MM" so plain string compare works
  function byNewest(a, b) { return a.published < b.published ? 1 : a.published > b.published ? -1 : 0; }

  function isVisible(article) {
    if (hiddenPublications[article.publication]) return false;
    if (searchText) {
      var haystack = (article.title + " " + article.description + " " + article.author).toLowerCase();
      if (haystack.indexOf(searchText) === -1) return false;
    }
    return true;
  }

  function articlesForTab(tab) {
    return report.articles.filter(function (a) {
      if (tab === "Educational") return a.educational;
      if (report.regions.indexOf(tab) !== -1) return a.regions.indexOf(tab) !== -1;
      return a.topic === tab;
    });
  }

  // ---- Rendering -----------------------------------------------------------
  function renderTabs() {
    var nav = document.getElementById("tabs");
    nav.innerHTML = "";
    tabList().forEach(function (name) {
      var count = name === "Same story"
        ? report.stories.length
        : articlesForTab(name).length;
      var btn = el("button", "tab" + (name === activeTab ? " active" : ""));
      btn.appendChild(el("span", "", name));
      btn.appendChild(el("span", "badge", count));
      btn.onclick = function () {
        activeTab = name;
        renderTabs();
        renderContent();
      };
      nav.appendChild(btn);
    });
    renderViewButtons();
  }

  // The "Read" and "Calendar" buttons open their view in place of the tabs' content;
  // clicking the same button again (or any tab) goes back to the news.
  function renderViewButtons() {
    var readBtn = document.getElementById("read-btn");
    readBtn.className = "btn-secondary" + (activeTab === "Read" ? " active" : "");
    document.getElementById("read-count").textContent = Object.keys(readHistory).length;

    var calBtn = document.getElementById("calendar-btn");
    calBtn.className = "btn-secondary" + (activeTab === "Calendar" ? " active" : "");
  }

  function toggleView(name) {
    if (activeTab === name) {
      activeTab = lastTab;
    } else {
      if (activeTab !== "Read" && activeTab !== "Calendar") lastTab = activeTab;
      activeTab = name;
    }
    renderTabs();
    renderContent();
  }

  function renderPublicationChips() {
    var box = document.getElementById("pub-chips");
    box.innerHTML = "";
    report.publications.forEach(function (pub) {
      var chip = el("button", "chip" + (hiddenPublications[pub] ? " off" : ""), pub);
      chip.onclick = function () {
        hiddenPublications[pub] = !hiddenPublications[pub];
        renderPublicationChips();
        renderContent();
      };
      box.appendChild(chip);
    });
  }

  function articleCard(article, showTopic) {
    var card = el("article", "card" + (readHistory[article.link] ? " read" : ""));

    var meta = el("div", "meta");
    meta.appendChild(el("span", "pub pub-" + slug(article.publication), article.publication));
    if (article.author) meta.appendChild(el("span", "author", "By " + article.author));
    if (article.section) meta.appendChild(el("span", "section", article.section));
    if (showTopic && article.topic !== "Other") meta.appendChild(el("span", "topic", article.topic));
    if (article.educational && activeTab !== "Educational") meta.appendChild(el("span", "tag", "Explainer"));
    article.regions.forEach(function (r) {
      if (r !== activeTab) meta.appendChild(el("span", "tag", r));
    });
    meta.appendChild(el("span", "time", article.published));
    meta.appendChild(readButton(article));
    card.appendChild(meta);

    var link = el("a", "title", article.title);
    link.href = article.link;
    link.target = "_blank";
    link.rel = "noopener";
    card.appendChild(link);

    if (article.description) card.appendChild(descriptionEl(article.description));
    return card;
  }

  // Descriptions are cut to two lines; clicking one shows the full text.
  function descriptionEl(text) {
    var p = el("p", "desc", text);
    p.title = "Click to expand";
    p.onclick = function () { p.classList.toggle("expanded"); };
    return p;
  }

  function renderContent() {
    var content = document.getElementById("content");
    content.innerHTML = "";

    if (activeTab === "Same story") {
      renderStories(content);
      return;
    }
    if (activeTab === "Read") {
      renderRead(content);
      return;
    }
    if (activeTab === "Calendar") {
      renderCalendar(content);
      return;
    }

    var list = articlesForTab(activeTab).filter(isVisible).sort(byNewest);
    if (list.length === 0) {
      content.appendChild(el("p", "empty", "Nothing here."));
      return;
    }
    var showTopic = activeTab === "Educational" || report.regions.indexOf(activeTab) !== -1;
    list.forEach(function (a) { content.appendChild(articleCard(a, showTopic)); });
  }

  function renderStories(content) {
    var byId = {};
    report.articles.forEach(function (a) { byId[a.id] = a; });

    var shown = 0;
    report.stories.forEach(function (story) {
      var members = story.article_ids.map(function (id) { return byId[id]; }).filter(isVisible).sort(byNewest);
      if (members.length < 2) return;
      shown += 1;

      var group = el("section", "story");
      var head = el("div", "story-head");
      head.appendChild(el("span", "story-label", story.label));
      head.appendChild(el("span", "story-count", members.length + " articles"));
      group.appendChild(head);

      members.forEach(function (a) {
        var row = el("div", "story-row" + (readHistory[a.link] ? " read" : ""));
        row.appendChild(el("span", "pub pub-" + slug(a.publication), a.publication));

        var body = el("div", "story-body");
        var link = el("a", "story-title", a.title);
        link.href = a.link;
        link.target = "_blank";
        link.rel = "noopener";
        body.appendChild(link);
        if (a.author) body.appendChild(el("span", "author", "By " + a.author));
        if (a.description) body.appendChild(descriptionEl(a.description));
        row.appendChild(body);

        row.appendChild(el("span", "time", a.published));
        row.appendChild(readButton(a));
        group.appendChild(row);
      });
      content.appendChild(group);
    });

    if (shown === 0) content.appendChild(el("p", "empty", "No stories covered by more than one outlet."));
  }

  // ---- Reading history -----------------------------------------------------
  function postJson(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  // The "+" on the right of a card: marks the article as read, "✓" when it already is.
  function readButton(article) {
    var isRead = !!readHistory[article.link];
    var btn = el("button", "read-btn" + (isRead ? " done" : ""), isRead ? "\u2713" : "+");
    btn.title = isRead ? "Read \u2014 click to remove from history" : "Mark as read";
    btn.onclick = function () { toggleRead(article); };
    return btn;
  }

  function toggleRead(article) {
    if (readHistory[article.link]) {
      postJson("/history/remove", { link: article.link })
        .then(function () {
          delete readHistory[article.link];
          renderTabs();
          renderContent();
        })
        .catch(function (err) { showMessage("Could not update history: " + err, false); });
      return;
    }
    // Send a snapshot of the article: the spreadsheet is overwritten on every fetch, so
    // this is the only copy the Read tab can show later.
    var snapshot = {
      link: article.link,
      title: article.title,
      description: article.description,
      publication: article.publication,
      section: article.section,
      author: article.author,
      published: article.published,
      topic: article.topic
    };
    postJson("/history/add", snapshot)
      .then(function (data) {
        if (!data.ok) { showMessage(data.message, false); return; }
        readHistory[article.link] = data.entry;
        renderTabs();
        renderContent();
      })
      .catch(function (err) { showMessage("Could not update history: " + err, false); });
  }

  function setRating(entry, rating) {
    // Clicking the rating that is already set clears it
    if (entry.rating === rating) rating = null;
    postJson("/history/rate", { link: entry.link, rating: rating })
      .then(function (data) {
        if (!data.ok) { showMessage(data.message, false); return; }
        readHistory[entry.link].rating = rating;
        renderContent();
      })
      .catch(function (err) { showMessage("Could not save rating: " + err, false); });
  }

  function ratingLabel(rating) {
    return rating.charAt(0).toUpperCase() + rating.slice(1);
  }

  // Sort order used by "Rating": great, normal, hard, bad, then unrated
  function ratingRank(rating) {
    var i = RATINGS.indexOf(rating);
    return i === -1 ? RATINGS.length : i;
  }

  function byReadAt(a, b) { return a.read_at < b.read_at ? 1 : a.read_at > b.read_at ? -1 : 0; }
  function byRating(a, b) {
    var diff = ratingRank(a.rating) - ratingRank(b.rating);
    return diff !== 0 ? diff : byReadAt(a, b);
  }

  function matchesFilter(entry, filter) {
    if (filter === "all") return true;
    if (filter === "unrated") return !entry.rating;
    return entry.rating === filter;
  }

  function renderRead(content) {
    var entries = Object.keys(readHistory).map(function (link) { return readHistory[link]; });

    if (entries.length === 0) {
      content.appendChild(el("p", "empty", "Nothing marked as read yet \u2014 click + on an article."));
      return;
    }

    // Toolbar: rating filter chips (with counts) on the left, sort buttons on the right
    var toolbar = el("div", "read-toolbar");

    var filterGroup = el("div", "read-group");
    filterGroup.appendChild(el("span", "read-group-label", "Show"));
    var filters = [["all", "All"]];
    RATINGS.forEach(function (r) { filters.push([r, ratingLabel(r)]); });
    filters.push(["unrated", "Unrated"]);
    filters.forEach(function (f) {
      var count = entries.filter(function (e) { return matchesFilter(e, f[0]); }).length;
      var chip = el("button", "chip rating-chip " + f[0] + (readFilter === f[0] ? " active" : ""), f[1]);
      chip.appendChild(el("span", "chip-count", count));
      chip.onclick = function () { readFilter = f[0]; renderContent(); };
      filterGroup.appendChild(chip);
    });
    toolbar.appendChild(filterGroup);

    var sortGroup = el("div", "read-group");
    sortGroup.appendChild(el("span", "read-group-label", "Sort by"));
    var segmented = el("div", "segmented");
    [["read_at", "Date read"], ["rating", "Rating"], ["published", "Published"]].forEach(function (o) {
      var btn = el("button", "segment" + (readSort === o[0] ? " active" : ""), o[1]);
      btn.onclick = function () { readSort = o[0]; renderContent(); };
      segmented.appendChild(btn);
    });
    sortGroup.appendChild(segmented);
    toolbar.appendChild(sortGroup);
    content.appendChild(toolbar);

    var list = entries.filter(function (e) { return matchesFilter(e, readFilter); }).filter(isVisible);

    if (readSort === "rating") list.sort(byRating);
    else if (readSort === "published") list.sort(byNewest);
    else list.sort(byReadAt);

    if (list.length === 0) {
      content.appendChild(el("p", "empty", "Nothing here."));
      return;
    }

    list.forEach(function (entry) { content.appendChild(readCard(entry)); });
  }

  // An article card plus the four rating buttons; used by the Read and Calendar views.
  function readCard(entry) {
    // Saved entries lack the tag fields the card expects
    entry.regions = entry.regions || [];
    entry.educational = false;
    var card = articleCard(entry, true);

    var rating = el("div", "rating");
    RATINGS.forEach(function (r) {
      var btn = el("button", "rating-btn " + r + (entry.rating === r ? " active" : ""), ratingLabel(r));
      btn.onclick = function () { setRating(entry, r); };
      rating.appendChild(btn);
    });
    rating.appendChild(el("span", "read-on", "Read on " + entry.read_at));
    card.appendChild(rating);
    return card;
  }

  // ---- Calendar ------------------------------------------------------------

  // "YYYY-MM-DD" -> how many articles were marked read that day
  function readCountsByDay() {
    var counts = {};
    Object.keys(readHistory).forEach(function (link) {
      var day = (readHistory[link].read_at || "").slice(0, 10);
      if (day) counts[day] = (counts[day] || 0) + 1;
    });
    return counts;
  }

  function entriesForDay(day) {
    return Object.keys(readHistory)
      .map(function (link) { return readHistory[link]; })
      .filter(function (e) { return (e.read_at || "").slice(0, 10) === day; })
      .sort(byReadAt);
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function dayKey(year, month, day) { return year + "-" + pad2(month + 1) + "-" + pad2(day); }

  // Colour step of a day cell: more articles read that day -> darker green
  function countLevel(count) {
    if (!count) return 0;
    if (count <= 2) return 1;
    if (count <= 5) return 2;
    if (count <= 9) return 3;
    return 4;
  }

  function renderCalendar(content) {
    var today = new Date();
    if (calYear === null) {
      calYear = today.getFullYear();
      calMonth = today.getMonth();
    }

    var counts = readCountsByDay();
    var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    // Date.getDay() is 0 for Sunday; the grid starts on Monday
    var leading = (new Date(calYear, calMonth, 1).getDay() + 6) % 7;

    var monthTotal = 0;
    for (var d = 1; d <= daysInMonth; d++) monthTotal += counts[dayKey(calYear, calMonth, d)] || 0;

    var panel = el("section", "calendar");

    var head = el("div", "cal-head");
    var prev = el("button", "cal-nav", "\u2039");
    prev.title = "Previous month";
    prev.onclick = function () { stepMonth(-1); };
    var next = el("button", "cal-nav", "\u203a");
    next.title = "Next month";
    next.onclick = function () { stepMonth(1); };
    head.appendChild(prev);
    head.appendChild(next);
    head.appendChild(el("span", "cal-month", MONTH_NAMES[calMonth] + " " + calYear));
    head.appendChild(el("span", "cal-total", monthTotal + " articles read this month"));
    panel.appendChild(head);

    var grid = el("div", "cal-grid");
    WEEKDAYS.forEach(function (w) { grid.appendChild(el("div", "cal-weekday", w)); });
    for (var i = 0; i < leading; i++) grid.appendChild(el("div", "cal-blank"));

    for (var day = 1; day <= daysInMonth; day++) {
      var key = dayKey(calYear, calMonth, day);
      var count = counts[key] || 0;
      var cell = el("button", "cal-day level-" + countLevel(count));
      if (key === dayKey(today.getFullYear(), today.getMonth(), today.getDate())) cell.className += " today";
      if (key === calSelectedDay) cell.className += " selected";
      cell.appendChild(el("span", "cal-daynum", day));
      if (count) cell.appendChild(el("span", "cal-count", count));
      cell.title = count === 1 ? "1 article read" : count + " articles read";
      cell.onclick = (function (k) {
        return function () {
          calSelectedDay = calSelectedDay === k ? null : k;
          renderContent();
        };
      })(key);
      grid.appendChild(cell);
    }
    panel.appendChild(grid);
    content.appendChild(panel);

    if (!calSelectedDay) {
      content.appendChild(el("p", "empty", "Click a day to see what you read."));
      return;
    }

    var entries = entriesForDay(calSelectedDay).filter(isVisible);
    content.appendChild(el("p", "cal-selection", calSelectedDay + " \u2014 " +
      (entries.length === 1 ? "1 article" : entries.length + " articles")));
    if (entries.length === 0) {
      content.appendChild(el("p", "empty", "Nothing read on this day."));
      return;
    }
    entries.forEach(function (entry) { content.appendChild(readCard(entry)); });
  }

  function stepMonth(delta) {
    calMonth += delta;
    if (calMonth < 0) { calMonth = 11; calYear -= 1; }
    if (calMonth > 11) { calMonth = 0; calYear += 1; }
    calSelectedDay = null;
    renderContent();
  }

  // ---- Wire up -------------------------------------------------------------
  document.getElementById("refresh-btn").onclick = refreshNews;
  document.getElementById("read-btn").onclick = function () { toggleView("Read"); };
  document.getElementById("calendar-btn").onclick = function () { toggleView("Calendar"); };
  document.getElementById("search").oninput = function (e) {
    searchText = e.target.value.trim().toLowerCase();
    renderContent();
  };
  loadHistory().then(loadArticles);
</script>
</body>
</html>
